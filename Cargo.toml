[workspace]
members = ["crates/sticky-core", "src-tauri"]
exclude = ["vendor/image-webp"]
default-members = ["crates/sticky-core"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-only"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
image-webp = { path = "vendor/image-webp" }
