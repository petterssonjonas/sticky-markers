name: Build release packages
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate tag and signing setup
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 scripts/release.py validate --tag "$RELEASE_TAG"
          if [ -z "$SIGNING_KEY" ]; then
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets; it must match the embedded public key.' >&2
            exit 1
          fi
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            platform: darwin
            arch: x86_64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            platform: darwin
            arch: aarch64
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux package prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf libfuse2 rpm flatpak flatpak-builder xvfb xdotool dbus-x11
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --locked -p sticky-core -p sticky-markers-mcp
      - name: Build MCP and signed desktop installers
        shell: bash
        env:
          STICKY_BUILD_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STICKY_GITHUB_CLIENT_ID: ${{ vars.STICKY_GITHUB_CLIENT_ID }}
          BUNDLES: ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          node scripts/prepare-mcp.mjs
          npm run tauri -- build --target "$STICKY_BUILD_TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.release.conf.json
      - name: Normalize Cargo target directory
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/release
          cp -R "target/$BUILD_TARGET/release/bundle" target/release/bundle
      - name: Collect native assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: python scripts/release.py collect --tag "$RELEASE_TAG" --platform "$PLATFORM" --arch "$ARCH"
      - name: Verify Linux package permissions
        if: runner.os == 'Linux'
        run: python3 scripts/check-linux-packages.py
      - name: Native Linux installer smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python3 scripts/native-smoke.py
      - name: Build Flatpak
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//49 org.gnome.Sdk//49
          python3 scripts/prepare-flatpak.py
          cd packaging/flatpak
          flatpak-builder --force-clean --repo=repo build dev.stickymarkers.desktop.json
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo "../../release-assets/sticky-markers-${RELEASE_TAG#v}-linux-flatpak-x86_64.flatpak" dev.stickymarkers.desktop
          cd ../..
          npx tauri signer sign --app-version "${RELEASE_TAG#v}" "release-assets/sticky-markers-${RELEASE_TAG#v}-linux-flatpak-x86_64.flatpak"
      - name: Verify Flatpak library dependencies
        if: runner.os == 'Linux'
        run: |
          flatpak install --user --noninteractive release-assets/*.flatpak
          flatpak run --command=sh dev.stickymarkers.desktop -c 'ldd /app/bin/sticky-markers > /tmp/sticky-libraries; cat /tmp/sticky-libraries; ! grep -q "not found" /tmp/sticky-libraries'
          xvfb-run -a dbus-run-session -- python3 scripts/native-smoke.py scripts/flatpak-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
  publish-assets:
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: D-Bus library for signature verifier
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Source archive, Arch packaging, update manifest, and checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          printf '%s' "$RELEASE_NOTES" > /tmp/sticky-release-notes.txt
          python3 scripts/release.py publish-assets --tag "$RELEASE_TAG" --notes-file /tmp/sticky-release-notes.txt
          cargo build --locked --release -p sticky-core --example verify-update
          python3 scripts/verify-release.py release-assets
      - name: Attach assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
