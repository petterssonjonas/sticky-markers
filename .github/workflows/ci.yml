name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf libfuse2t64 rpm xvfb xdotool dbus-x11
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo test --locked -p sticky-core -p sticky-markers-mcp
      - run: cargo build --locked -p sticky-markers-mcp
      - run: python scripts/mcp-smoke.py
        if: runner.os != 'Windows'
      - run: python scripts/mcp-smoke.py target/debug/sticky-markers-mcp.exe
        if: runner.os == 'Windows'
      - name: Browser workflows
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Build installers and bundled MCP
        run: npm run package
        env:
          STICKY_GITHUB_CLIENT_ID: ${{ vars.STICKY_GITHUB_CLIENT_ID }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Native Linux lifecycle
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python3 scripts/native-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-markers-${{ runner.os }}
          path: |
            target/release/bundle/
            target/release/sticky-markers-mcp*
          if-no-files-found: error
